name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes a running check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each attribute's derivation; evaluating it catches option/package breakage
        # without building anything (CUDA-heavy derivations and macOS systems can't
        # be built on this runner)
        attr:
          - nixosConfigurations.workstation.config.system.build.toplevel
          - nixosConfigurations.eyad-nixos.config.system.build.toplevel
          - nixosConfigurations.home-server.config.system.build.toplevel
          # The Mac VMs (aarch64-linux)
          - nixosConfigurations.vm-fusion.config.system.build.toplevel
          - nixosConfigurations.vm-utm.config.system.build.toplevel
          - darwinConfigurations.eyad-m3.config.system.build.toplevel
          - darwinConfigurations.eyad-mac.config.system.build.toplevel
          # The Omarchy (Arch) machines: Home Manager only
          - homeConfigurations."eyad@vector".activationPackage
          - homeConfigurations."eyad@cachy".activationPackage
    name: eval ${{ matrix.attr }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - run: nix eval --raw '.#${{ matrix.attr }}.drvPath'

  # The packages in pkgs/ (download hashes go stale when upstream re-releases)
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Build pkgs/
        run: |
          for p in $(nix eval --json .#packages.x86_64-linux --apply builtins.attrNames | jq -r '.[]'); do
            echo "::group::$p"
            nix build --no-link -L ".#packages.x86_64-linux.$p"
            echo "::endgroup::"
          done

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Check formatting
        run: nix fmt -- --ci
