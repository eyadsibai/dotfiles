name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes a running check
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What to evaluate is the flake's own list (evalTargets, which `just check` reads
  # too), so a new host is checked without being added here
  targets:
    runs-on: ubuntu-latest
    outputs:
      attrs: ${{ steps.list.outputs.attrs }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - id: list
        run: |
          attrs=$(nix eval --json .#evalTargets)
          echo "attrs=$attrs" >> "$GITHUB_OUTPUT"

  eval:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each attribute's derivation; evaluating it catches option/package breakage
        # without building anything (CUDA-heavy derivations and macOS systems can't
        # be built on this runner)
        attr: ${{ fromJSON(needs.targets.outputs.attrs) }}
    name: eval ${{ matrix.attr }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - run: nix eval --raw ".#$ATTR.drvPath"
        env:
          ATTR: ${{ matrix.attr }}

  # The packages in pkgs/ (download hashes go stale when upstream re-releases)
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Build pkgs/
        run: |
          for p in $(nix eval --json .#packages.x86_64-linux --apply builtins.attrNames | jq -r '.[]'); do
            echo "::group::$p"
            nix build --no-link -L ".#packages.x86_64-linux.$p"
            echo "::endgroup::"
          done

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Check formatting
        run: nix fmt -- --ci
