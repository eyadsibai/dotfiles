name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - nixosConfigurations.workstation
          - nixosConfigurations.eyad-nixos
          - nixosConfigurations.home-server
          - darwinConfigurations.eyad-m3
          - darwinConfigurations.eyad-mac
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Evaluating catches option/package breakage without building anything
      # (CUDA-heavy derivations and macOS systems can't be built on this runner)
      - name: Evaluate ${{ matrix.host }}
        run: nix eval --raw .#${{ matrix.host }}.config.system.build.toplevel.drvPath

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check formatting
        run: nix fmt -- --ci
