# /etc/nix/nix.conf for the Arch machines (pacman's nix, no NixOS module to write it).
# Keep the caches in step with modules/common/nix.nix.
#   sudo cp arch/nix.conf /etc/nix/nix.conf && sudo systemctl restart nix-daemon

# Unix group containing the Nix build user accounts
build-users-group = nixbld
max-jobs = auto
experimental-features = nix-command flakes

# Mirror of cache.nixos.org first: the CDN route from home caps at ~1 MB/s, the mirror
# does 3-4x that. Same files, signed by the cache.nixos.org key.
substituters = https://mirrors.tuna.tsinghua.edu.cn/nix-channels/store?priority=30 https://cache.nixos.org/ https://nix-community.cachix.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
