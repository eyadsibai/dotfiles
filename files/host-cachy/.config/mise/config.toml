# Standalone ad-hoc CLIs not packaged by pacman; uv and node come from pacman,
# and project language SDKs live in each repo's devenv.nix.
[tools]
"cargo:zoetrope" = "latest"
herdr = "latest"
"github:zenbu-labs/terminal-browser" = { version = "latest", version_prefix = "v", strip_components = 1, bin_path = "bin" }
git-cliff = "latest"

[settings]
minimum_release_age_excludes = ["claude", "codex"]

[settings.upgrade]

