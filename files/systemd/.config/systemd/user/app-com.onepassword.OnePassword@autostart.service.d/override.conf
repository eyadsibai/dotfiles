# 1Password exits cleanly when pacman replaces /opt/1Password/1password during
# an upgrade, leaving ~/.1password/agent.sock dead so SSH fails until it is
# reopened. Wait for pacman to finish unpacking, then let systemd bring it back.
[Unit]
ConditionFileIsExecutable=/opt/1Password/1password
StartLimitIntervalSec=60s
StartLimitBurst=5

[Service]
Restart=always
RestartSec=3
TimeoutStartSec=infinity
ExecStartPre=/usr/bin/sh -c 'while [ -e /var/lib/pacman/db.lck ] && /usr/bin/pgrep -x pacman >/dev/null; do /usr/bin/sleep 1; done'
