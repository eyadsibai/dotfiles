# Live TV mpv profile. The tv launcher loads it with --include, so
# ~/.config/mpv/mpv.conf doesn't need to reference it.

[tv]
profile-desc=Live TV: used by the `tv` launcher (~/.local/bin/tv) and TV.desktop
# tv.lua: per-channel headers, grouped channel menu (ENTER/c), digit channel
# entry, auto-reconnect, dead-channel guard. Loaded only with this profile.
script=~~/tv/tv.lua
force-window=yes
# Own app id so Omarchy's "float plain mpv" rule doesn't apply; the matching
# window rule (tiled, fully opaque) lives in ~/.config/hypr/hyprland.lua.
wayland-app-id=mpv-tv
title=TV${?media-title: · ${media-title}}
# Direct .m3u8 URLs only; skipping the yt-dlp fallback makes dead channels fail fast.
ytdl=no
# Decode on the GPU where mpv knows it works (mpv's own default is CPU): TV runs for hours.
hwdec=auto-safe
# Wrap around at both ends of the channel list, and keep the window open when
# tv.lua stops zapping after a run of failures.
loop-playlist=inf
idle=yes
network-timeout=12
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_delay_max=5
hls-bitrate=max
force-seekable=yes
save-position-on-quit=no
# Tighter channel menus than mpv's usual uosc rows, so a small TV window still
# shows a useful number of channels.
script-opts-append=uosc-menu_item_height=32
script-opts-append=uosc-font_scale=0.95
af=lavfi=[dynaudnorm]
cache=yes
demuxer-max-bytes=32MiB
demuxer-readahead-secs=3
