# Track Omarchy's shipped kitty config instead of forking it. That file is
# owned by the omarchy package and updates with it, so upstream improvements
# and new integration settings (e.g. the remote-control socket) arrive on
# their own. Personal overrides go below: in kitty the last setting wins, so
# anything here beats the include.
include /usr/share/omarchy/config/kitty/kitty.conf

# --- Personal overrides -----------------------------------------------------

# Font
font_family CaskaydiaMono Nerd Font

# Let remote programs read and write both clipboards
clipboard_control write-clipboard read-clipboard write-primary read-primary

# Keybindings
map F11 toggle_fullscreen

# Dropped 2026-09-13: window_padding_height, show_window_resize_notification
# and single_instance are not kitty config options and were being ignored.
# Padding comes from the include (window_padding_width 14); for one instance
# per session launch kitty with -1.

# >>> herdr-radar font block
symbol_map U+E1A0-U+E1B7 Herdr Agent Icons Max
symbol_map U+E1C0-U+E1C5 Herdr Agent Icons Max
# <<< herdr-radar font block

# Per-machine settings (font size), from the host-<hostname> package.
globinclude local.conf
