# Read by /usr/bin/spotify, Arch's wrapper: one flag per line, and no empty lines (one
# would reach Spotify as an empty argument). spicetify starts Spotify without the
# wrapper, so the theme-set hook 10-spotify.sh gives it the same flags.
#
# Natively on Wayland. Under XWayland Spotify draws at GDK_SCALE (2) whatever the
# monitor's scale is, which on vector's 1.6 made everything a quarter too big.
--ozone-platform=wayland
