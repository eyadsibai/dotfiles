# Who can decrypt files in secrets/:
#   eyad        — personal age key in ~/.config/sops/age/keys.txt (back it up!)
#   workstation — derived from /etc/ssh/ssh_host_ed25519_key.pub via ssh-to-age
keys:
  - &eyad age19aqrkjuz9ctk4vcscydv7s2trwkjkxac42llcr2c6fdy9jf0zyesmahg9a
  - &workstation age14uy4r2380uasvd4zdhrtyr5zgw5ns767ajfnhnv96fjqlhp9tucq5aewy5
creation_rules:
  - path_regex: secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *eyad
          - *workstation
